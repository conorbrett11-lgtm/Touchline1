<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Touchline — Football Manager Simulator</title>
<style>
:root{--bg:#0b1010;--panel:#121a19;--panel2:#182321;--line:#263431;--text:#f4f7f5;--muted:#9aaba5;--green:#8ce0a9;--green2:#2c8d60;--red:#ff7777;--gold:#f0c66b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1c332b 0%,#0b1010 48%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#1b2824;color:var(--text);font-weight:650}button:hover{border-color:var(--green);filter:brightness(1.1)}button.primary{background:var(--green);color:#102018;border-color:var(--green)}button.ghost{background:transparent}button.small{padding:6px 9px;font-size:12px}
input,select{background:#0d1513;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none;min-width:0}input:focus,select:focus{border-color:var(--green)}
.app{max-width:1440px;margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;letter-spacing:-.7px}.brandmark{width:35px;height:35px;border-radius:11px;background:var(--green);color:#102018;display:grid;place-items:center;font-weight:900}.topmeta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#101816}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.sidebar,.panel,.card{background:rgba(18,26,25,.94);border:1px solid var(--line);border-radius:16px}.sidebar{padding:14px;height:max-content;position:sticky;top:12px}.club-mini{padding:10px 9px 15px;border-bottom:1px solid var(--line);margin-bottom:10px}.club-mini strong{display:block;font-size:15px}.club-mini span{color:var(--muted);font-size:12px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border-color:transparent;color:#b8c6c0;font-weight:600}.nav button.active{background:#20342b;border-color:#315b46;color:var(--green)}.nav .ico{width:20px;text-align:center}.sidebar-bottom{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
main{min-width:0}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}.page-head h1{font-size:26px;letter-spacing:-.8px;margin:3px 0 0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr)}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px;min-width:0}.card h3{margin:0 0 12px;font-size:14px}.stat{font-size:25px;font-weight:850;letter-spacing:-1px}.statlabel{font-size:12px;color:var(--muted)}.statrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:16px;margin:0}.section-title small{color:var(--muted)}
.match-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:14px}.pitch-card{padding:12px;background:#13231d;border:1px solid #294737;border-radius:16px;min-height:365px;position:relative;overflow:hidden}.pitch{height:340px;border:1px solid rgba(220,255,230,.35);border-radius:8px;position:relative;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 48px,transparent 48px,transparent 96px),linear-gradient(90deg,#1b5036,#17452f);overflow:hidden}.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.35)}.pitch:after{content:"";position:absolute;width:105px;height:105px;border:1px solid rgba(255,255,255,.35);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.boxline{position:absolute;width:125px;height:60px;border:1px solid rgba(255,255,255,.35);left:50%;transform:translateX(-50%)}.boxline.top{top:0;border-top:0}.boxline.bottom{bottom:0;border-bottom:0}.match-score{position:absolute;z-index:2;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(8,18,13,.87);border:1px solid rgba(255,255,255,.18);padding:8px 13px;border-radius:12px;white-space:nowrap}.team-chip{display:flex;align-items:center;gap:7px;font-weight:800}.crest{width:28px;height:28px;border-radius:8px;background:#e8eee9;color:#17251d;display:grid;place-items:center;font-size:10px;font-weight:900}.score{font-size:20px;font-weight:900}.pitch-left{position:absolute;z-index:2;left:13px;top:50%;transform:translateY(-50%);display:grid;gap:9px}.pitch-left .team-tile{background:rgba(8,18,13,.88);border:1px solid rgba(255,255,255,.18);padding:9px;border-radius:10px;width:122px}.team-tile b{display:block;font-size:12px}.team-tile span{font-size:10px;color:#b8c9bf}.pitch-note{position:absolute;right:12px;bottom:10px;color:#d3e5d8;font-size:10px;z-index:2}.sim-side{display:grid;gap:12px;align-content:start}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:var(--muted);font-weight:600;text-align:left;padding:7px 5px;border-bottom:1px solid var(--line)}.table td{padding:8px 5px;border-bottom:1px solid #202d29}.table tr:last-child td{border:0}.table .you{color:var(--green);font-weight:800}.table td:last-child,.table th:last-child{text-align:right}
.fixture{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.fixture:last-child{border:0}.fixture-team{font-weight:700}.fixture small{display:block;color:var(--muted);font-size:11px}.result{font-weight:850;color:var(--green)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:145px}.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-row strong{display:block}.list-row small{color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 7px;font-size:10px;color:var(--muted)}
.player-row{display:grid;grid-template-columns:30px minmax(0,1fr) 42px 45px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.player-row:last-child{border:0}.number{width:27px;height:27px;border-radius:8px;background:#20342b;display:grid;place-items:center;color:var(--green);font-weight:800;font-size:11px}.rating{font-weight:850;text-align:right}.pos{color:var(--muted);font-size:11px;text-align:right}
.start-screen{max-width:900px;margin:7vh auto;padding:26px}.start-hero{text-align:center;margin-bottom:25px}.start-hero .brand{justify-content:center;font-size:26px}.start-hero h1{font-size:36px;letter-spacing:-1.5px;margin:18px 0 8px}.start-hero p{color:var(--muted);max-width:550px;margin:auto}.start-card{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.club-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:330px;overflow:auto;margin-top:12px}.club-option{display:flex;align-items:center;gap:9px;text-align:left;background:#101816;padding:10px}.club-option.selected{border-color:var(--green);background:#1b3026}.club-dot{width:28px;height:28px;border-radius:8px;background:#263a31;display:grid;place-items:center;font-size:10px;font-weight:900}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{padding:11px 13px;border-radius:10px;background:#182a23;border:1px solid #31533f;color:#ccebd7;font-size:12px;margin-top:12px}.hidden{display:none!important}.mobile-nav{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav{grid-template-columns:repeat(3,1fr)}.sidebar-bottom,.club-mini{display:none}.match-layout,.grid.two{grid-template-columns:1fr}.grid.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{padding:12px}.topbar{align-items:flex-start}.topmeta{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center;padding:9px 4px;font-size:11px;gap:4px;flex-direction:column}.grid.three{grid-template-columns:1fr 1fr}.page-head h1{font-size:22px}.pitch{height:300px}.pitch-card{min-height:325px}.club-grid{grid-template-columns:1fr 1fr}.start-hero h1{font-size:29px}.list-row{grid-template-columns:minmax(0,1fr) auto}.list-row .tag{display:none}}

.match-watch{background:#102019;border:1px solid #31513f;border-radius:16px;padding:14px}
.watch-pitch{height:470px;max-height:62vh;min-height:340px;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.65);border-radius:9px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 10%,transparent 10%,transparent 20%),linear-gradient(90deg,#17613b,#145333)}
.watch-pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.55)}
.watch-pitch:after{content:"";position:absolute;width:105px;height:105px;border:2px solid rgba(255,255,255,.55);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.watch-box{position:absolute;left:50%;transform:translateX(-50%);width:34%;height:13%;border:2px solid rgba(255,255,255,.55)}
.watch-box.top{top:-2px;border-top:0}.watch-box.bottom{bottom:-2px;border-bottom:0}
.player-dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid white;transform:translate(-50%,-50%);z-index:3;box-shadow:0 1px 5px #07110b;transition:left .48s linear,top .48s linear}
.player-dot.home{background:#ed4242}.player-dot.away{background:#3288ff}
.match-ball{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #111;border-radius:50%;z-index:5;transform:translate(-50%,-50%);transition:left .48s linear,top .48s linear;box-shadow:0 0 7px #fff}
.watch-scorebar{display:flex;justify-content:center;align-items:center;gap:18px;padding:8px;font-weight:800}.watch-scorebar .score{font-size:26px}
.watch-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.commentary{min-height:115px;max-height:180px;overflow:auto}
.commentary p{margin:6px 0;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:12px}
@media(max-width:560px){.watch-pitch{height:370px;min-height:300px}.player-dot{width:11px;height:11px}}
</style>
</head>

<script>
const LEAGUES = {

"La Liga":["Alaves","Athletic Club","Atletico Madrid","Barcelona","Celta Vigo","Elche","Espanyol","Getafe","Girona","Levante","Mallorca","Osasuna","Oviedo","Rayo Vallecano","Real Betis","Real Madrid","Real Sociedad","Sevilla","Valencia","Villarreal"],
"Bundesliga":["Augsburg","Bayer Leverkusen","Bayern Munich","Borussia Dortmund","Borussia Monchengladbach","Eintracht Frankfurt","Freiburg","Hamburger SV","Heidenheim","Hoffenheim","Koln","Mainz 05","RB Leipzig","St Pauli","Stuttgart","Union Berlin","Werder Bremen","Wolfsburg"],
"Serie A":["Atalanta","Bologna","Cagliari","Como","Cremonese","Fiorentina","Genoa","Inter","Juventus","Lazio","Lecce","Milan","Napoli","Parma","Pisa","Roma","Sassuolo","Torino","Udinese","Verona"],
"Ligue 1":["Angers","Auxerre","Brest","Le Havre","Lens","Lille","Lorient","Lyon","Marseille","Metz","Monaco","Nantes","Nice","Paris FC","Paris Saint-Germain","Rennes","Strasbourg","Toulouse"],
"Championship":["Birmingham City","Blackburn Rovers","Bristol City","Charlton Athletic","Coventry City","Derby County","Hull City","Ipswich Town","Leicester City","Middlesbrough","Millwall","Norwich City","Oxford United","Portsmouth","Preston North End","Queens Park Rangers","Sheffield United","Sheffield Wednesday","Southampton","Stoke City","Swansea City","Watford","West Bromwich Albion","Wrexham"]
};
const SHORT = {"Manchester United":"MUN","Manchester City":"MCI","Newcastle United":"NEW","Tottenham Hotspur":"TOT","West Ham United":"WHU","Wolverhampton Wanderers":"WOL","Nottingham Forest":"NFO","Crystal Palace":"CRY","Brighton":"BHA","Aston Villa":"AVL","Leeds United":"LEE","Real Madrid":"RMA","Atletico Madrid":"ATM","Barcelona":"BAR","Bayer Leverkusen":"B04","Borussia Dortmund":"BVB","Borussia Monchengladbach":"BMG","Bayern Munich":"BAY","RB Leipzig":"RBL","Paris Saint-Germain":"PSG","Paris FC":"PFC","Inter":"INT","Milan":"MIL","Juventus":"JUV","Napoli":"NAP"};
const DATA = {
"Manchester United":[["Senne Lammens","GK",80],["Diogo Dalot","RB",82],["Matthijs de Ligt","CB",84],["Harry Maguire","CB",81],["Luke Shaw","LB",81],["Casemiro","CDM",82],["Kobbie Mainoo","CM",82],["Bruno Fernandes","CAM",88],["Bryan Mbeumo","RW",84],["Matheus Cunha","LW",84],["Benjamin Sesko","ST",83],["Andre Onana","GK",82],["Noussair Mazraoui","RB",82],["Lisandro Martinez","CB",83],["Manuel Ugarte","CDM",80],["Mason Mount","CM",81],["Amad Diallo","RW",83],["Joshua Zirkzee","ST",80]],
"Arsenal":[["David Raya","GK",86],["Ben White","RB",84],["William Saliba","CB",89],["Gabriel","CB",88],["Riccardo Calafiori","LB",84],["Declan Rice","CDM",89],["Martin Odegaard","CAM",88],["Mikel Merino","CM",84],["Bukayo Saka","RW",89],["Gabriel Martinelli","LW",85],["Viktor Gyokeres","ST",86]],
"Liverpool":[["Alisson","GK",89],["Trent Alexander-Arnold","RB",87],["Virgil van Dijk","CB",90],["Ibrahima Konate","CB",86],["Andy Robertson","LB",85],["Alexis Mac Allister","CM",87],["Ryan Gravenberch","CDM",85],["Dominik Szoboszlai","CAM",86],["Mohamed Salah","RW",90],["Luis Diaz","LW",87],["Darwin Nunez","ST",83]],
"Manchester City":[["Ederson","GK",88],["Kyle Walker","RB",85],["Ruben Dias","CB",89],["John Stones","CB",86],["Josko Gvardiol","LB",87],["Rodri","CDM",91],["Bernardo Silva","CM",88],["Kevin De Bruyne","CAM",90],["Phil Foden","RW",89],["Jeremy Doku","LW",85],["Erling Haaland","ST",91]],
"Chelsea":[["Robert Sanchez","GK",82],["Reece James","RB",85],["Levi Colwill","CB",84],["Wesley Fofana","CB",83],["Marc Cucurella","LB",84],["Moises Caicedo","CDM",87],["Enzo Fernandez","CM",86],["Cole Palmer","CAM",90],["Noni Madueke","RW",83],["Pedro Neto","LW",85],["Nicolas Jackson","ST",83]],
"Real Madrid":[["Thibaut Courtois","GK",90],["Dani Carvajal","RB",86],["Antonio Rudiger","CB",87],["Eder Militao","CB",86],["Ferland Mendy","LB",84],["Federico Valverde","CM",89],["Jude Bellingham","CAM",91],["Aurelien Tchouameni","CDM",87],["Rodrygo","RW",87],["Vinicius Junior","LW",91],["Kylian Mbappe","ST",92]],
"Barcelona":[["Marc-Andre ter Stegen","GK",88],["Jules Kounde","RB",87],["Ronald Araujo","CB",87],["Pau Cubarsi","CB",82],["Alejandro Balde","LB",84],["Pedri","CM",90],["Frenkie de Jong","CM",88],["Gavi","CM",85],["Lamine Yamal","RW",89],["Raphinha","LW",87],["Robert Lewandowski","ST",89]],
"Bayern Munich":[["Manuel Neuer","GK",88],["Joshua Kimmich","RB",88],["Dayot Upamecano","CB",86],["Kim Min-jae","CB",85],["Alphonso Davies","LB",88],["Aleksandar Pavlovic","CDM",82],["Leon Goretzka","CM",85],["Jamal Musiala","CAM",90],["Michael Olise","RW",87],["Kingsley Coman","LW",86],["Harry Kane","ST",92]],
"Paris Saint-Germain":[["Gianluigi Donnarumma","GK",89],["Achraf Hakimi","RB",88],["Marquinhos","CB",88],["Willian Pacho","CB",83],["Nuno Mendes","LB",87],["Vitinha","CM",88],["Joao Neves","CM",86],["Warren Zaire-Emery","CM",85],["Ousmane Dembele","RW",88],["Bradley Barcola","LW",86],["Goncalo Ramos","ST",84]],
"Inter":[["Yann Sommer","GK",87],["Denzel Dumfries","RWB",85],["Alessandro Bastoni","CB",88],["Francesco Acerbi","CB",84],["Federico Dimarco","LWB",87],["Hakan Calhanoglu","CDM",87],["Nicolo Barella","CM",89],["Henrikh Mkhitaryan","CM",85],["Marcus Thuram","ST",86],["Lautaro Martinez","ST",90],["Mehdi Taremi","ST",83]]
};
const state={club:null,league:null,tab:"Hub",season:2026,week:1,played:0,points:0,wins:0,draws:0,losses:0,gf:0,ga:0,budget:85000000,squad:[],transfers:[],fixtures:[],table:[],saved:false};
const allClubs=Object.entries(LEAGUES).flatMap(([league,clubs])=>clubs.map(club=>({club,league})));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function abbrev(c){return SHORT[c]||c.split(/\s+/).map(x=>x[0]).join("").slice(0,3).toUpperCase()}
function makeSquad(club){if(DATA[club])return DATA[club].map((p,i)=>({name:p[0],pos:p[1],ovr:p[2],no:i+1}));const names=["Alex Morgan","Jordan Williams","Daniel Smith","Lucas Martin","Ethan Brown","Noah Wilson","Leo Garcia","Oliver Taylor","Mason Clark","Jack Robinson","Kai Johnson","Sam Walker","Ryan Lewis","Ben Hall","Theo White","Adam Green","Max Scott","Charlie Young"];const pos=["GK","RB","CB","CB","LB","CDM","CM","CAM","RW","LW","ST","GK","CB","CM","RW","LB","ST","CM"];return names.map((n,i)=>({name:n,pos:pos[i],ovr:67+((i*7+club.length*3)%17),no:i+1}))}
function makeFixtures(){const clubs=LEAGUES[state.league];let others=clubs.filter(c=>c!==state.club);let list=[];for(let i=0;i<Math.min(10,others.length);i++){let opponent=others[(i*7+state.club.length)%others.length];list.push({opponent,home:i%2===0,played:false,score:null})}return list}
function standings(){let clubs=LEAGUES[state.league].map((club,i)=>({club,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));let me=clubs.find(x=>x.club===state.club);Object.assign(me,{p:state.played,w:state.wins,d:state.draws,l:state.losses,gf:state.gf,ga:state.ga,pts:state.points});clubs.forEach((c,i)=>{if(c.club!==state.club){c.p=Math.max(0,(i*3+state.week)%9);c.w=Math.floor(c.p*.45);c.d=Math.floor(c.p*.25);c.l=c.p-c.w-c.d;c.gf=c.w*2+c.d+((i*3)%5);c.ga=c.l*2+c.d+((i*2)%4);c.pts=c.w*3+c.d;}});return clubs.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
function startCareer(club,league){state.club=club;state.league=league;state.squad=makeSquad(club);state.fixtures=makeFixtures();state.table=standings();state.tab="Hub";render()}
function save(){if(!state.club)return;localStorage.setItem("touchline_save",JSON.stringify(state));state.saved=true;render()}
function load(){try{let s=JSON.parse(localStorage.getItem("touchline_save"));if(s&&s.club){Object.assign(state,s);return true}}catch(e){}return false}
let liveMatch=null,matchTimer=null;
function simMatch(index){
 let f=state.fixtures[index];if(!f||f.played||liveMatch)return;
 const strength=state.squad.slice(0,11).reduce((a,p)=>a+p.ovr,0)/Math.max(1,Math.min(11,state.squad.length));
 const own=Math.max(0,Math.round(Math.random()*2.8+(strength-78)/9+(f.home?.45:0)));
 const opp=Math.max(0,Math.round(Math.random()*2.7+(f.home?0:.4)));
 const gf=f.home?own:opp,ga=f.home?opp:own;
 const homeName=f.home?state.club:f.opponent,awayName=f.home?f.opponent:state.club;
 const events=[];
 for(let i=0;i<gf;i++)events.push({minute:8+Math.floor(Math.random()*82),team:"home",kind:"GOAL"});
 for(let i=0;i<ga;i++)events.push({minute:8+Math.floor(Math.random()*82),team:"away",kind:"GOAL"});
 events.sort((a,b)=>a.minute-b.minute);
 liveMatch={index,fixture:f,homeName,awayName,homeGoals:gf,awayGoals:ga,minute:0,shownHome:0,shownAway:0,events,eventIndex:0,playing:false,log:[{minute:0,text:"Kick-off! The match is underway."}]};
 renderMatchViewer();
}
function matchDots(){
 const home=[[50,88],[22,76],[42,78],[60,78],[80,76],[35,61],[64,61],[50,49],[20,39],[80,39],[50,25]];
 const away=[[50,12],[22,24],[42,22],[60,22],[80,24],[35,39],[64,39],[50,51],[20,61],[80,61],[50,75]];
 let seed=liveMatch.minute;
 const jitter=(v,i,axis)=>Math.max(5,Math.min(95,v+Math.sin((seed/7)+i*1.8+(axis?2:0))*(seed?4:0)));
 return home.map((p,i)=>`<span class="player-dot home" style="left:${jitter(p[0],i,0)}%;top:${jitter(p[1],i,1)}%" title="${esc(state.squad[i]?.name||"Home player")}"></span>`).join("")+
 away.map((p,i)=>`<span class="player-dot away" style="left:${jitter(p[0],i+4,1)}%;top:${jitter(p[1],i+4,0)}%" title="Away player"></span>`).join("")+
 `<span class="match-ball" style="left:${12+((seed*17)%76)}%;top:${20+((seed*29)%60)}%"></span>`;
}
function renderMatchViewer(){
 const m=liveMatch;if(!m)return;
 const root=$("#root");
 root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">T</span> TOUCHLINE</div><div class="topmeta"><span class="pill">LIVE MATCH</span><span class="pill">${esc(state.club)}</span></div></header>
 <div class="page-head"><div><div class="eyebrow">${esc(state.league)} · MATCHWEEK ${m.index+1}</div><h1>Match centre</h1><div class="muted">${esc(m.homeName)} vs ${esc(m.awayName)}</div></div><button class="ghost" onclick="leaveMatch()">← Back to fixtures</button></div>
 <div class="match-watch"><div class="watch-scorebar"><span>${esc(m.homeName)}</span><span class="score">${m.shownHome} – ${m.shownAway}</span><span>${esc(m.awayName)}</span></div>
 <div class="watch-pitch"><div class="watch-box top"></div><div class="watch-box bottom"></div>${matchDots()}</div>
 <div class="watch-controls"><span class="pill">⏱ ${m.minute}'</span><button class="primary" onclick="toggleMatch()">${m.playing?"Ⅱ Pause":"▶ Play"}</button><button onclick="stepMatch(10)">+10 minutes</button><button onclick="finishMatch()">Finish match</button><label class="muted">Speed</label><select id="matchSpeed" onchange="changeMatchSpeed()"><option value="1200">1×</option><option value="600">2×</option><option value="300">4×</option></select></div>
 </div>
 <div class="card" style="margin-top:14px"><div class="section-title"><h2>Match commentary</h2><span class="tag">${m.minute>=90?"FULL TIME":"LIVE"}</span></div><div class="commentary">${m.log.slice().reverse().map(e=>`<p><b>${e.minute}'</b> ${esc(e.text)}</p>`).join("")}</div></div>
 <div class="notice">2D match simulation: red dots represent ${esc(m.homeName)} and blue dots represent ${esc(m.awayName)}. The white ball moves around the pitch as play develops.</div></div>`;
}
function addMatchMinute(n){
 const m=liveMatch;if(!m)return;
 const target=Math.min(90,m.minute+n);
 while(m.eventIndex<m.events.length&&m.events[m.eventIndex].minute<=target){
  const e=m.events[m.eventIndex++];if(e.team==="home"){m.shownHome++;m.log.push({minute:e.minute,text:`GOAL! ${m.homeName} score!`})}else{m.shownAway++;m.log.push({minute:e.minute,text:`GOAL! ${m.awayName} score!`})}
 }
 m.minute=target;
 if(m.minute>=90){m.log.push({minute:90,text:"Full time!"});m.playing=false;clearInterval(matchTimer);matchTimer=null;renderMatchViewer();return}
 if(n>0&&m.minute%10===0)m.log.push({minute:m.minute,text:["A spell of possession in midfield.","The ball is switched out wide.","A chance is developing in the final third.","Both teams are battling for control."][Math.floor(Math.random()*4)]});
 renderMatchViewer();
}
function toggleMatch(){if(!liveMatch)return;if(liveMatch.playing){clearInterval(matchTimer);matchTimer=null;liveMatch.playing=false;renderMatchViewer()}else{liveMatch.playing=true;const speed=Number($("#matchSpeed")?.value||1200);matchTimer=setInterval(()=>addMatchMinute(1),speed);renderMatchViewer()}}
function changeMatchSpeed(){if(liveMatch?.playing){clearInterval(matchTimer);matchTimer=setInterval(()=>addMatchMinute(1),Number($("#matchSpeed").value))}}
function stepMatch(n){if(!liveMatch)return;liveMatch.playing=false;clearInterval(matchTimer);matchTimer=null;addMatchMinute(n)}
function finishMatch(){if(!liveMatch)return;liveMatch.playing=false;clearInterval(matchTimer);matchTimer=null;addMatchMinute(90-liveMatch.minute);if(liveMatch)completeMatch()}
function completeMatch(){
 const m=liveMatch;if(!m)return;const f=m.fixture;const own=f.home?m.homeGoals:m.awayGoals,opp=f.home?m.awayGoals:m.homeGoals;
 f.played=true;f.score=`${own}–${opp}`;state.played++;state.week++;state.gf+=m.homeGoals===undefined?0:(f.home?m.homeGoals:m.awayGoals);state.ga+=f.home?m.awayGoals:m.homeGoals;
 if(own>opp){state.wins++;state.points+=3}else if(own===opp){state.draws++;state.points++}else state.losses++;
 state.table=standings();liveMatch=null;save();go("Fixtures");
}
function leaveMatch(){if(!liveMatch)return;if(confirm("Leave this match? It will be abandoned and the fixture will remain unplayed.")){clearInterval(matchTimer);matchTimer=null;liveMatch=null;go("Fixtures")}}

function simNext(){let idx=state.fixtures.findIndex(f=>!f.played);if(idx>=0)simMatch(idx)}
function pageHead(title,sub,action=""){return `<div class="page-head"><div><div class="eyebrow">${esc(state.league)} · ${state.season}/${String(state.season+1).slice(-2)}</div><h1>${title}</h1><div class="muted">${sub||""}</div></div>${action}</div>`}
function nav(){let items=[["Hub","⌂"],["Leagues","▤"],["Transfers","⇄"],["Fixtures","▦"],["Squads","♙"],["Tactics","⚙"]];return `<aside class="sidebar"><div class="club-mini"><strong>${esc(state.club)}</strong><span>Manager career · Season ${state.season}/${state.season+1}</span></div><div class="nav">${items.map(([t,i])=>`<button class="${state.tab===t?"active":""}" onclick="go('${t}')"><span class="ico">${i}</span>${t}</button>`).join("")}</div><div class="sidebar-bottom"><button class="small" onclick="save()">Save career</button><button class="small ghost" onclick="newCareer()">New career</button></div></aside>`}
function miniTable(){let rows=standings().slice(0,8);return `<div class="card"><div class="section-title"><h3>League table</h3><small>Top 8</small></div><table class="table"><thead><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.club===state.club?"you":""}"><td>${i+1}</td><td>${esc(r.club)}</td><td>${r.p}</td><td>${r.gf-r.ga>0?"+":""}${r.gf-r.ga}</td><td>${r.pts}</td></tr>`).join("")}</tbody></table><button class="small ghost" style="margin-top:10px" onclick="go('Leagues')">View full table →</button></div>`}
function hub(){let next=state.fixtures.find(f=>!f.played);let played=state.fixtures.filter(f=>f.played);return `${pageHead("Manager hub","Your season at a glance",`<button class="primary" onclick="simNext()">▶ Sim next match</button>`)}
<div class="grid three" style="margin-bottom:14px"><div class="card"><div class="stat">${state.points}</div><div class="statlabel">League points</div></div><div class="card"><div class="stat">${state.wins}-${state.draws}-${state.losses}</div><div class="statlabel">W-D-L record</div></div><div class="card"><div class="stat">€${(state.budget/1000000).toFixed(1)}m</div><div class="statlabel">Transfer budget</div></div></div>
<div class="match-layout"><div class="grid"><div class="pitch-card"><div class="pitch"><div class="boxline top"></div><div class="boxline bottom"></div><div class="match-score"><div class="team-chip"><span class="crest">${abbrev(state.club)}</span>${esc(state.club)}</div><span class="score">VS</span><div class="team-chip"><span class="crest">${next?abbrev(next.opponent):"—"}</span>${next?esc(next.opponent):"Season complete"}</div></div><div class="pitch-left"><div class="team-tile"><b>${esc(state.club)}</b><span>YOUR CLUB</span></div><div class="team-tile"><b>${next?esc(next.opponent):"No fixture"}</b><span>${next?(next.home?"AWAY":"HOME"):"UP NEXT"}</span></div></div><div class="pitch-note">TOUCHLINE · MATCH CENTRE</div></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Next fixture</h3><span class="tag">Matchweek ${state.week}</span></div>${next?`<div class="fixture"><div><span class="fixture-team">${esc(next.home?state.club:next.opponent)}</span><small>Home</small></div><b>vs</b><div style="text-align:right"><span class="fixture-team">${esc(next.home?next.opponent:state.club)}</span><small>Away</small></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="simNext()">Simulate match</button>`:`<p class="muted">All available fixtures have been played.</p>`}</div><div class="card"><div class="section-title"><h3>Recent results</h3><small>${played.length} played</small></div>${played.length?played.slice(-3).reverse().map(f=>`<div class="fixture"><div class="fixture-team">${esc(f.opponent)}</div><span class="result">${f.score}</span></div>`).join(""):`<div class="empty">No matches played yet.</div>`}</div></div></div><div class="sim-side">${miniTable()}<div class="card"><h3>Career actions</h3><div class="grid"><button onclick="go('Squads')">Manage squad</button><button onclick="go('Transfers')">Open transfer market</button><button onclick="go('Tactics')">Set tactics</button></div></div></div></div>`}
function leagues(){let rows=standings();return `${pageHead("League","Full league standings") }<div class="card"><div class="section-title"><h2>${esc(state.league)}</h2><span class="tag">Season ${state.season}/${state.season+1}</span></div><table class="table"><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.club===state.club?"you":""}"><td>${i+1}</td><td>${esc(r.club)} ${r.club===state.club?"· YOU":""}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}</tbody></table><div class="notice">Your club's record updates when you simulate fixtures. Other clubs' records are illustrative prototype data.</div></div>`}
function fixtures(){return `${pageHead("Fixtures","Your upcoming schedule and match results",`<button class="primary" onclick="simNext()">▶ Sim next</button>`)}<div class="card"><div class="section-title"><h2>Season fixtures</h2><span class="tag">${state.fixtures.filter(f=>f.played).length}/${state.fixtures.length} played</span></div>${state.fixtures.map((f,i)=>`<div class="fixture"><div><span class="fixture-team">${esc(f.home?state.club:f.opponent)} <span class="muted">vs</span> ${esc(f.home?f.opponent:state.club)}</span><small>Matchweek ${i+1} · ${f.home?"Home":"Away"}</small></div>${f.played?`<span class="result">${f.score}</span>`:`<button class="small primary" onclick="simMatch(${i})">Simulate</button>`}</div>`).join("")}</div>`}
function squads(){return `${pageHead("Squad","First-team player list and ratings",`<button onclick="addPlayer()">＋ Add player</button>`)}<div class="grid two"><div class="card"><div class="section-title"><h2>First team</h2><span class="tag">${state.squad.length} players</span></div>${state.squad.map((p,i)=>`<div class="player-row"><div class="number">${p.no}</div><div><strong>${esc(p.name)}</strong><div class="muted" style="font-size:11px">${p.pos}</div></div><div class="rating">${p.ovr}</div><div class="pos">OVR</div></div>`).join("")}</div><div class="card"><h3>Squad overview</h3><div class="statrow"><span class="muted">Average rating</span><b>${Math.round(state.squad.reduce((a,p)=>a+p.ovr,0)/state.squad.length)}</b></div><div class="statrow" style="margin-top:12px"><span class="muted">Goalkeepers</span><b>${state.squad.filter(p=>p.pos==="GK").length}</b></div><div class="statrow" style="margin-top:12px"><span class="muted">Defenders</span><b>${state.squad.filter(p=>["CB","RB","LB","RWB","LWB"].includes(p.pos)).length}</b></div><div class="statrow" style="margin-top:12px"><span class="muted">Midfielders</span><b>${state.squad.filter(p=>["CDM","CM","CAM"].includes(p.pos)).length}</b></div><div class="statrow" style="margin-top:12px"><span class="muted">Forwards</span><b>${state.squad.filter(p=>["ST","LW","RW"].includes(p.pos)).length}</b></div><div class="notice">Squad data is seeded for selected major clubs. Other clubs use clearly illustrative placeholder players until a verified database is connected.</div></div></div>`}
function transfers(){let candidates=[["Jamal Musiala","Bayern Munich","CAM",90,105000000],["Florian Wirtz","Bayer Leverkusen","CAM",89,98000000],["Victor Osimhen","Napoli","ST",88,78000000],["Alphonso Davies","Bayern Munich","LB",88,72000000],["Khvicha Kvaratskhelia","Napoli","LW",88,85000000],["Joao Neves","Paris Saint-Germain","CM",86,65000000],["Evan Ferguson","Brighton","ST",81,32000000],["Jarrad Branthwaite","Everton","CB",82,38000000],["Benjamin Sesko","Manchester United","ST",83,48000000],["Rayan Cherki","Lyon","CAM",82,35000000],["Nico Williams","Athletic Club","LW",85,60000000],["Estevao","Chelsea","RW",80,30000000]];let q=window.transferQuery||"";return `${pageHead("Transfer market","Search targets and make offers")}<div class="card"><div class="toolbar"><input id="transferSearch" placeholder="Search player, club or position…" value="${esc(q)}" oninput="window.transferQuery=this.value;filterTransfers()"><select id="positionFilter" onchange="filterTransfers()"><option value="">All positions</option>${["GK","CB","RB","LB","CDM","CM","CAM","RW","LW","ST"].map(p=>`<option>${p}</option>`).join("")}</select><span class="tag">Budget €${(state.budget/1e6).toFixed(1)}m</span></div><div id="transferRows">${transferRows(candidates,q,"")}</div><div class="notice">Prototype transfer shortlist with indicative values, not live market valuations. Signing a player adds them to your squad and deducts the listed fee.</div></div>`}
function transferRows(candidates,q,pos){let filtered=candidates.filter(p=>(p.join(" ").toLowerCase().includes(q.toLowerCase()))&&(!pos||p[2]===pos));return filtered.map((p,i)=>`<div class="list-row"><div><strong>${esc(p[0])}</strong><small>${esc(p[1])} · ${p[2]} · OVR ${p[3]}</small></div><b>€${(p[4]/1e6).toFixed(0)}m</b><button class="small primary" onclick="signPlayer('${esc(p[0])}','${p[2]}',${p[3]},${p[4]})">Sign</button></div>`).join("")||`<div class="empty">No players match that search.</div>`}
function filterTransfers(){let q=$("#transferSearch").value,pos=$("#positionFilter").value;let c=[["Jamal Musiala","Bayern Munich","CAM",90,105000000],["Florian Wirtz","Bayer Leverkusen","CAM",89,98000000],["Victor Osimhen","Napoli","ST",88,78000000],["Alphonso Davies","Bayern Munich","LB",88,72000000],["Khvicha Kvaratskhelia","Napoli","LW",88,85000000],["Joao Neves","Paris Saint-Germain","CM",86,65000000],["Evan Ferguson","Brighton","ST",81,32000000],["Jarrad Branthwaite","Everton","CB",82,38000000],["Benjamin Sesko","Manchester United","ST",83,48000000],["Rayan Cherki","Lyon","CAM",82,35000000],["Nico Williams","Athletic Club","LW",85,60000000],["Estevao","Chelsea","RW",80,30000000]];$("#transferRows").innerHTML=transferRows(c,q,pos)}
function signPlayer(name,pos,ovr,fee){if(fee>state.budget){alert("Not enough transfer budget.");return}if(state.squad.some(p=>p.name===name)){alert("This player is already in your squad.");return}state.budget-=fee;state.squad.push({name,pos,ovr,no:state.squad.length+1});state.transfers.push(name);save();go("Squads");}
function tactics(){return `${pageHead("Tactics","Choose your shape and playing approach")}<div class="grid two"><div class="card"><h2 style="margin-top:0">Team setup</h2><label class="muted">Formation</label><select id="formation" style="width:100%;margin:7px 0 16px"><option>4-2-3-1</option><option>4-3-3 Holding</option><option>4-4-2</option><option>3-5-2</option><option>4-1-4-1</option></select><label class="muted">Mentality</label><select id="mentality" style="width:100%;margin:7px 0 16px"><option>Balanced</option><option>Attacking</option><option>Very Attacking</option><option>Defensive</option><option>Very Defensive</option></select><label class="muted">Build-up</label><select id="buildup" style="width:100%;margin:7px 0 16px"><option>Balanced</option><option>Short passing</option><option>Counter attack</option><option>Long ball</option></select><label class="muted">Defensive line</label><select id="line" style="width:100%;margin:7px 0 16px"><option>Balanced</option><option>High press</option><option>Mid block</option><option>Deep block</option></select><button class="primary" onclick="saveTactics()">Save tactics</button></div><div class="card"><h3>Squad strength</h3><div class="stat">${Math.round(state.squad.slice(0,11).reduce((a,p)=>a+p.ovr,0)/Math.min(11,state.squad.length))} <span class="muted" style="font-size:13px">/ 99</span></div><p class="muted">Your starting XI average rating is used as one factor in match simulation.</p><div class="notice" id="tacticNote">Current tactics: 4-2-3-1 · Balanced · Balanced build-up · Balanced line</div></div></div>`}
function saveTactics(){let val=["formation","mentality","buildup","line"].map(id=>$("#"+id).value);$("#tacticNote").textContent="Saved tactics: "+val.join(" · ");localStorage.setItem("touchline_tactics",JSON.stringify(val))}
function go(tab){state.tab=tab;render()}
function newCareer(){if(confirm("Start a new career? Your current career is saved only if you have saved it.")){localStorage.removeItem("touchline_save");state.club=null;render()}}
function addPlayer(){let name=prompt("Player name?");if(!name)return;let pos=(prompt("Position? (GK, CB, RB, LB, CDM, CM, CAM, RW, LW, ST)","CM")||"CM").toUpperCase();let ovr=Math.max(40,Math.min(99,Number(prompt("Overall rating?","70"))||70));state.squad.push({name,pos,ovr,no:state.squad.length+1});save();go("Squads")}
function renderStart(){let leagueFilter="All";$("#root").innerHTML=`<div class="start-screen"><div class="start-hero"><div class="brand"><span class="brandmark">T</span> TOUCHLINE</div><h1>Build your football legacy.</h1><p>Take charge of a club, shape your squad, manage transfers and simulate your season.</p></div><div class="start-card"><div class="section-title"><h2>Choose your club</h2><span class="tag">6 leagues · ${allClubs.length} clubs</span></div><div class="toolbar"><input id="clubSearch" placeholder="Search for a club…" oninput="filterClubs()"><select id="leagueFilter" onchange="filterClubs()"><option>All leagues</option>${Object.keys(LEAGUES).map(l=>`<option>${l}</option>`).join("")}</select></div><div class="club-grid" id="clubGrid">${clubOptions(allClubs)}</div><div class="notice">Choose any club from the Premier League, La Liga, Bundesliga, Serie A, Ligue 1 or the Championship.</div><button id="startBtn" class="primary" style="width:100%;margin-top:15px" disabled onclick="beginSelected()">Start career →</button><div style="text-align:center;margin-top:12px"><button class="ghost small" onclick="continueCareer()">Continue saved career</button></div></div></div>`}
let selectedClub=null;
function clubOptions(clubs){return clubs.map(x=>`<button class="club-option ${selectedClub===x.club?"selected":""}" onclick="selectClub('${esc(x.club)}','${esc(x.league)}')"><span class="club-dot">${abbrev(x.club)}</span><span><b>${esc(x.club)}</b><small style="display:block;color:var(--muted);font-size:10px">${esc(x.league)}</small></span></button>`).join("")}
function filterClubs(){let q=$("#clubSearch").value.toLowerCase(),l=$("#leagueFilter").value;let clubs=allClubs.filter(x=>x.club.toLowerCase().includes(q)&&(l==="All leagues"||x.league===l));$("#clubGrid").innerHTML=clubOptions(clubs)}
function selectClub(c,l){selectedClub=c;document.querySelectorAll(".club-option").forEach(b=>b.classList.toggle("selected",b.textContent.includes(c)));$("#startBtn").disabled=false;window.selectedLeague=l}
function beginSelected(){if(selectedClub)startCareer(selectedClub,window.selectedLeague)}
function continueCareer(){if(load())render();else alert("No saved career found on this device yet.")}
function render(){if(!state.club){renderStart();return}let pages={Hub:hub,Leagues:leagues,Transfers:transfers,Fixtures:fixtures,Squads:squads,Tactics:tactics};$("#root").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">T</span> TOUCHLINE</div><div class="topmeta"><span class="pill">${esc(state.club)}</span><span class="pill">Season ${state.season}/${state.season+1}</span><span class="pill">€${(state.budget/1e6).toFixed(1)}m budget</span></div></header><div class="layout">${nav()}<main>${(pages[state.tab]||hub)()}</main></div></div>`}
render();
</script>
</body></html>
